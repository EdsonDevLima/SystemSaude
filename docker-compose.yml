services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: systemsaude-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__connectionDefault: Server=sqlserver,1433;Database=SystemSaudeDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
    ports:
      - "8080:8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: systemsaude-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_password123 -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
